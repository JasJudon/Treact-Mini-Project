<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treat Mini Project</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js"></script>
    <script src="https://kit.fontawesome.com/7699a5347b.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="landing">
        <nav>
            <div class="nav__row">
                <div class="nav__logo">
                    <img class="nav__logo--img" src="./Treact Assets/logo-purple background.svg" alt="treact logo">
                    <span class="nav__logo--title">Treact</span>
                </div> 
                <ul class="nav-links">
                    <li><a href="#" class="nav__link">About</a></li>
                    <li><a href="#" class="nav__link">Blog</a></li>
                    <li><a href="#" class="nav__link">Pricing</a></li>
                    <li><a href="#" class="nav__link">Contact Us</a></li>
                    <li><a href="#" class="nav__link login">Log In</a></li>
                    <li><button href="#" class="nav__button">Sign Up</button></li>
                </ul>
            </div>
        </nav>
        <header>
            <div class="container">
                <div class="row">
                    <div class="header__description">
                        <h1>Beautiful React Templates <span>for you.</span></h1>
                        <p class="header__para">Our templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.</p>
                        <div class="header__email">
                            <input type="text" class="header__email--entry" placeholder="Your E-mail Address">
                            <button class="header__email--button">Get Started</button>
                        </div>
                        <p class="header__customer--title">OUR TRUSTED CUSTOMERS</p>
                        <img src="./Treact Assets/customers-logo-strip.png" class="header__customers">
                    </div>
                    <figure class="header__img--main">
                        <img src="./Treact Assets/design-illustration.svg">
                    </figure>
                </div>
            </div>
        </header>
    </section>
</body>



</html>
